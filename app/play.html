<!DOCTYPE html>
<!--PXN play.html, ©2023-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pxn</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <script src="../script/play.js" async></script>
  <style>
    body{
      background-color: #333;
      margin: 0;
    }
    .assembly {
      width: 0;
      height: 0;
      position: absolute;
      transform-style: preserve-3d;
    }
    .geo {
      width: 1em;
      height: 1em;
      position: absolute;
      /* background-image: linear-gradient(#f00, #0f0); */
      background-blend-mode: multiply;
      backface-visibility: hidden;
    }
      </style>
</head>
<body>
  <div id="viewport" style="width: 100vw; height: 100vh; position: fixed; overflow: hidden; perspective: 800px; top: 0;">
    <div id="camera" class="assembly" style="top: 50%; left: 50%; transform: translateZ(800px);">
    <div id="scene" class="assembly">
    </div>
    </div>
  </div>
<!--PXN control.html, ©2026-->
<style>
  div { touch-action: none; }
  @media (orientation:landscape) {
    #controlUI-move {
      right: 3em;
      /* margin-right: 3em; */
      height: 60%;
    }
  }
  @media (orientation:portrait) {
    #controlUI-move {
      bottom: 3em;
      margin-bottom: 0px;
      width: 60%;
    }
  }
  
  .control {
    position: absolute;
    width: 50%;
    height: 50%;
  }
</style>
<div id="controlUI" style="width: 100%; height: 100%;">
  <div id="controlUI-move" style="margin:auto; scrollbar-width:none; overscroll-behavior:contain; position:absolute; overflow:scroll; aspect-ratio:1; background:#0008; touch-action: pan-x pan-y">
    <input id="joy-center" type="file" style="margin:75%; position:relative; width:25%; aspect-ratio:1; background:#f008;  pointer-events: all; touch-action: pan-x pan-y;">
  </div>
  <!--div id="controlUI-look" class="control" style="left: 50%; top: 50%;"></div>
  <div id="controlUI-place" class="control" style="left: 50%; top: 0%;"></div>
  <div id="controlUI-destroy" class="control" style="left: 0%; top: 0%;"></div-->
</div>
    <script src="../script/pause.js" async></script>
</body>
</html>
